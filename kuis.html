<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuis Astronomi</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">🌌 Zakss Astronomi</a><nav><a href="index.html">🏠 Beranda</a><a href="belajar.html">📚 Pembelajaran</a><a href="sejarah.html">🕰️ Sejarah</a><a href="alam-semesta.html">🌌 Alam Semesta</a><a href="antariksa.html">🚀 Antariksa</a><a href="kuis.html">🧠 Kuis</a></nav></header><main class="hero"><p class="tag">CHALLENGE</p><h1>🧠 Kuis Astronomi</h1><div id="quiz"></div><button class="btn" onclick="check()">Cek Jawaban</button><h2 id="score"></h2></main><footer>🌌 Belajar Astronomi • Pembuat: Zakss</footer><script>const q=[['Planet terbesar di Tata Surya?',['Bumi','Mars','Jupiter','Venus'],2],['Galaksi tempat Tata Surya berada?',['Andromeda','Bima Sakti','Triangulum','Sombrero'],1],['Satelit alami Bumi?',['Bulan','Titan','Europa','Phobos'],0],['Bintang pusat Tata Surya?',['Sirius','Betelgeuse','Matahari','Vega'],2]];const box=document.getElementById('quiz');q.forEach((x,i)=>{box.innerHTML+=`<div class="cards" style="display:block;margin:18px 0"><div class="fact"><b>${i+1}. ${x[0]}</b>${x[1].map((a,j)=>`<label style="display:block;text-align:left;margin:10px"><input type="radio" name="q${i}" value="${j}"> ${a}</label>`).join('')}</div></div>`});function check(){let s=0;q.forEach((x,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`);if(a&&+a.value===x[2])s++});document.getElementById('score').textContent=`Skor kamu: ${s}/${q.length} 🎉`}</script></body></html>
